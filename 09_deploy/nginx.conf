# 无状态 Streamable HTTP 反代。
# 缓冲关掉，读超时留够，访问日志按方法名/工具名分桶但不记 Authorization。
log_format mcp_safe '$remote_addr $status $request_time "$uri" '
                    'method="$http_mcp_method" tool="$http_mcp_name"';

server {
    listen 443 ssl;
    server_name mcp.internal;

    location /mcp {
        proxy_pass http://127.0.0.1:8020/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;

        # 2026-07-28 起没有会话头，这三个头必须透传：
        # 协议版本每次必带，方法名与工具名供网关直接做路由、限流和审计。
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Method           $http_mcp_method;
        proxy_set_header Mcp-Name             $http_mcp_name;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;

        access_log /var/log/nginx/mcp.log mcp_safe;
    }
}
